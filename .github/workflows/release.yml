name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node & pnpm
        uses: ./.github/actions/setup-node

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  container:
    name: container
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sign in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # arm64 is here for the Raspberry Pi and Apple Silicon crowd.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  npm:
    name: npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      # Required for npm provenance.
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node & pnpm
        uses: ./.github/actions/setup-node
        with:
          registry-url: https://registry.npmjs.org

      - name: Publish
        run: pnpm publish --provenance --no-git-checks --access public
        env:
          # NPM_TOKEN is the conventional name; AUTH_TOKEN is accepted so an
          # existing secret under that name keeps working.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.AUTH_TOKEN }}

  packages:
    name: linux packages
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node & pnpm
        uses: ./.github/actions/setup-node

      - name: Build
        run: pnpm build

      - name: Install nfpm
        run: |
          curl -fsSL -o nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "${NFPM_SHA256}  nfpm.tar.gz" | sha256sum -c -
          tar -xzf nfpm.tar.gz -C /usr/local/bin nfpm
          rm nfpm.tar.gz
          nfpm --version
        env:
          NFPM_VERSION: "2.43.0"
          NFPM_SHA256: "a80d5f724ed70b192ffa8a2bde469c013cef559c8afa3441eb51dd9a918beb6b"

      - name: Build deb and rpm
        run: scripts/build-packages.sh "${GITHUB_REF_NAME#v}" "${{ matrix.arch }}"

      # Building a package proves very little; installing it is what catches a
      # missing dependency or a tree staged wrongly. amd64 only, because the
      # runner cannot execute an arm64 binary without emulation.
      - name: Smoke test the deb
        if: matrix.arch == 'amd64'
        run: scripts/smoke-test-packages.sh "${GITHUB_REF_NAME#v}"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages-${{ matrix.arch }}
          path: packaging/dist/*
          if-no-files-found: error

  github-release:
    name: github release
    needs: [container, npm]
    # A missing npm token should not swallow the release notes.
    if: always() && needs.container.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node & pnpm
        uses: ./.github/actions/setup-node

      - name: Publish release notes
        run: pnpm dlx changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-assets:
    name: release assets
    # The release has to exist before anything can be attached to it, and the
    # packages have to be built. A failed npm publish must not strand them.
    #
    # always() is doing real work here and must stay. This job depends on
    # github-release, which depends on npm, and GitHub skips a job when anything
    # in its dependency chain failed — not just its direct needs. Without it, a
    # failed npm publish silently skips this job and the release is published
    # with no packages attached, which is exactly what happened to v0.1.0. The
    # explicit result checks then re-impose the gating always() removes.
    needs: [packages, github-release]
    if: always() && needs.packages.result == 'success' && needs.github-release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: linux-packages-*
          merge-multiple: true
          path: packages

      - name: Attach to the release
        run: gh release upload "$GITHUB_REF_NAME" packages/* --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
