name: CodeQL

on:
  push:
    branches:
      - main
  # Every pull request, not only the ones targeting main: a stacked pull
  # request is based on the branch below it, and branch protection requires
  # this check on all of them.
  pull_request:
  schedule:
    # Weekly, so a newly published advisory still gets caught on a quiet repo.
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-codeql
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Analyse
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
