# A harness for testing Lantern against agent CLIs that really run.
#
# This is NOT the deployment compose — that is ../docker-compose.yml. This one
# exists because every source adapter in Lantern was written against
# hand-authored fixtures, and twice that meant shipping a format that does not
# exist. Here the CLIs execute for real and write their own histories, and
# Lantern reads what they wrote.
#
#   ./run.sh          build, drive every CLI, then serve Lantern
#
# No API keys and no network: one local model serves all of it. Ollama speaks
# both wire formats the CLIs need — OpenAI's /v1/chat/completions and
# Anthropic's /v1/messages — so no translating gateway is involved.

name: lantern-harness

services:
  # --------------------------------------------------------------------------
  # The model
  # --------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  # Pulls the model once, then exits. Separate from the server so that "healthy"
  # means ready rather than still downloading.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama: { condition: service_healthy }
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen3:0.6b}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "pulling $${OLLAMA_MODEL} (first run only; cached in a volume)"
        ollama pull "$${OLLAMA_MODEL}"
    restart: "no"

  # --------------------------------------------------------------------------
  # The CLIs under test. Each writes into a named volume that Lantern mounts.
  # --------------------------------------------------------------------------
  claude-code:
    build:
      context: ./cli
      dockerfile: Dockerfile.claude-code
    profiles: ["drive"]
    depends_on:
      ollama-pull: { condition: service_completed_successfully }
    environment:
      # No /v1 suffix — Claude Code appends it itself.
      ANTHROPIC_BASE_URL: http://ollama:11434
      # Required by the client, ignored by Ollama. Not a credential.
      ANTHROPIC_AUTH_TOKEN: ollama
      ANTHROPIC_MODEL: "${OLLAMA_MODEL:-qwen3:0.6b}"
      HARNESS_OWNED_DIRS: /home/agent/.claude
      PROMPTS: /prompts
    volumes:
      - claude_home:/home/agent/.claude
      - ./workspace:/workspace-src:ro
      - ./prompts:/prompts:ro
    restart: "no"

  codex:
    build:
      context: ./cli
      dockerfile: Dockerfile.codex
    profiles: ["drive"]
    depends_on:
      ollama-pull: { condition: service_completed_successfully }
    environment:
      CODEX_HOME: /home/agent/.codex
      HARNESS_OWNED_DIRS: /home/agent/.codex
      OLLAMA_BASE_URL: http://ollama:11434/v1
      CODEX_MODEL: "${OLLAMA_MODEL:-qwen3:0.6b}"
      PROMPTS: /prompts
    volumes:
      - codex_home:/home/agent/.codex
      - ./workspace:/workspace-src:ro
      - ./prompts:/prompts:ro
    restart: "no"

  opencode:
    build:
      context: ./cli
      dockerfile: Dockerfile.opencode
    profiles: ["drive"]
    depends_on:
      ollama-pull: { condition: service_completed_successfully }
    environment:
      XDG_DATA_HOME: /home/agent/.local/share
      HARNESS_OWNED_DIRS: /home/agent/.local/share
      OLLAMA_BASE_URL: http://ollama:11434/v1
      OPENCODE_MODEL: "${OLLAMA_MODEL:-qwen3:0.6b}"
      PROMPTS: /prompts
    volumes:
      - opencode_home:/home/agent/.local/share
      - ./workspace:/workspace-src:ro
      - ./prompts:/prompts:ro
    restart: "no"

  # Stands in for Gemini CLI, which cannot be pointed at a local model at all.
  # No adapter reads this yet — it runs so that PR-7 is written against the
  # files it produces rather than against a description of them.
  qwen-code:
    build:
      context: ./cli
      dockerfile: Dockerfile.qwen-code
    profiles: ["drive"]
    depends_on:
      ollama-pull: { condition: service_completed_successfully }
    environment:
      HARNESS_OWNED_DIRS: /home/agent/.qwen
      OPENAI_BASE_URL: http://ollama:11434/v1
      # Required by the client, ignored by Ollama. Not a credential.
      OPENAI_API_KEY: ollama
      OPENAI_MODEL: "${OLLAMA_MODEL:-qwen3:0.6b}"
      PROMPTS: /prompts
    volumes:
      - qwen_home:/home/agent/.qwen
      - ./workspace:/workspace-src:ro
      - ./prompts:/prompts:ro
    restart: "no"

  # A probe as much as a driver: it is not yet established that Copilot CLI
  # starts without a paid subscription, even in BYOK mode. What it writes — or
  # fails to write — is what PR-8 gets decided on.
  copilot:
    build:
      context: ./cli
      dockerfile: Dockerfile.copilot
    profiles: ["drive"]
    depends_on:
      ollama-pull: { condition: service_completed_successfully }
    environment:
      HARNESS_OWNED_DIRS: /home/agent/.copilot
      COPILOT_PROVIDER_TYPE: openai
      COPILOT_PROVIDER_BASE_URL: http://ollama:11434/v1
      # Required by the client, ignored by Ollama. Not a credential.
      COPILOT_PROVIDER_API_KEY: ollama
      COPILOT_MODEL: "${OLLAMA_MODEL:-qwen3:0.6b}"
      PROMPTS: /prompts
    volumes:
      - copilot_home:/home/agent/.copilot
      - ./workspace:/workspace-src:ro
      - ./prompts:/prompts:ro
    restart: "no"

  # goose keeps its sessions in SQLite, like current opencode. It is here to
  # check the read-only SQLite backend against a second CLI's database rather
  # than one shaped only like opencode's.
  goose:
    build:
      context: ./cli
      dockerfile: Dockerfile.goose
    profiles: ["drive"]
    depends_on:
      ollama-pull: { condition: service_completed_successfully }
    environment:
      XDG_DATA_HOME: /home/agent/.local/share
      HARNESS_OWNED_DIRS: /home/agent/.local/share
      GOOSE_PROVIDER: ollama
      OLLAMA_HOST: http://ollama:11434
      GOOSE_MODEL: "${OLLAMA_MODEL:-qwen3:0.6b}"
      PROMPTS: /prompts
    volumes:
      - goose_home:/home/agent/.local/share/goose
      - ./workspace:/workspace-src:ro
      - ./prompts:/prompts:ro
    restart: "no"

  # --------------------------------------------------------------------------
  # Lantern, reading all of them
  # --------------------------------------------------------------------------
  lantern:
    build:
      # The release image, then the CLIs on top: on a real machine they share a
      # host, and topic naming shells out to whichever one is selected. Without
      # them here the "Sort N new" path cannot be exercised at all.
      context: .
      dockerfile: Dockerfile.lantern
      args:
        # Built by run.sh from the repo root before this one.
        LANTERN_IMAGE: lantern-harness-app
    environment:
      LANTERN_ENV: production
      PORT: 3400
      # Claude's directory stays at the default $HOME/.claude on purpose: the
      # cache DB path is derived from the parent of the Claude directory while
      # the rest of the state uses $HOME, and they only agree there.
      CODEX_HOME: /root/.codex
      XDG_DATA_HOME: /root/.local/share
      # Qwen Code has no env var for its home, so the volume is mounted at the
      # default $HOME/.qwen and the adapter finds it there.
      # LANTERN_SOURCES is deliberately NOT set — it locks the settings UI
      # against changes. run.sh seeds sources.json instead, which leaves the
      # toggles working.
    ports:
      - "${LANTERN_PORT:-3410}:3400"
    volumes:
      - claude_home:/root/.claude
      - codex_home:/root/.codex
      - opencode_home:/root/.local/share
      - qwen_home:/root/.qwen
      - copilot_home:/root/.copilot
      # Nested inside the opencode mount above: goose and opencode both live
      # under XDG_DATA_HOME, so the child path is what distinguishes them.
      - goose_home:/root/.local/share/goose
      - lantern_state:/root/.lantern
    restart: unless-stopped
    init: true

volumes:
  ollama_models:
  claude_home:
  codex_home:
  opencode_home:
  qwen_home:
  copilot_home:
  goose_home:
  lantern_state:
